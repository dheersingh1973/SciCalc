<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include JQuery for backward compatibility as requested in the plan -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="theme-light">
    <div class="calculator-app">
        <!-- Settings/Accessibility Controls -->
        <header class="app-header">
            <h1 class="app-title">Scientific Calculator</h1>
            <div class="controls-group">
                <button id="theme-toggle" class="control-btn" aria-label="Toggle High Contrast Mode" title="Toggle High Contrast Mode">
                    🌓 <span class="btn-text">Contrast</span>
                </button>
                <button id="history-toggle" class="control-btn" aria-label="Toggle History Sidebar" title="Toggle History Sidebar">
                    📜 <span class="btn-text">History</span>
                </button>
            </div>
        </header>

        <div class="calculator-layout">
            <!-- Main Calculator Panel -->
            <main class="calculator-container" aria-label="Calculator Interface">
                <!-- Modes and Indicators -->
                <div class="indicators" aria-live="polite">
                    <span id="deg-rad-indicator" class="indicator-badge">RAD</span>
                    <span id="memory-indicator" class="indicator-badge hidden">M</span>
                </div>

                <!-- Display Unit -->
                <div class="display-container">
                    <div id="formula-display" class="formula-view" aria-label="Formula display" aria-live="polite"></div>
                    <div id="display" class="result-view" aria-label="Result display" aria-live="polite" tabIndex="0">0</div>
                </div>

                <!-- Toggle Mode Panel (Basic/Scientific) -->
                <div class="mode-selector">
                    <button id="deg-rad-toggle" class="mode-btn font-bold" aria-label="Toggle between degrees and radians">DEG/RAD</button>
                    <button id="clear-all" class="mode-btn btn-danger" aria-label="Clear all">AC</button>
                    <button id="backspace" class="mode-btn" aria-label="Backspace">⌫</button>
                </div>

                <!-- Keyboard Grid -->
                <div id="buttons-grid" class="buttons-grid">
                    <!-- Scientific buttons -->
                    <button class="btn btn-sci" data-val="sin" aria-label="sine">sin</button>
                    <button class="btn btn-sci" data-val="cos" aria-label="cosine">cos</button>
                    <button class="btn btn-sci" data-val="tan" aria-label="tangent">tan</button>
                    <button class="btn btn-sci" data-val="^" aria-label="power">^</button>

                    <button class="btn btn-sci" data-val="asin" aria-label="arcsine">asin</button>
                    <button class="btn btn-sci" data-val="acos" aria-label="arccosine">acos</button>
                    <button class="btn btn-sci" data-val="atan" aria-label="arctangent">atan</button>
                    <button class="btn btn-sci" data-val="sqrt" aria-label="square root">√</button>

                    <button class="btn btn-sci" data-val="ln" aria-label="natural logarithm">ln</button>
                    <button class="btn btn-sci" data-val="log10" aria-label="logarithm base 10">log</button>
                    <button class="btn btn-sci" data-val="exp" aria-label="exponential base e">exp</button>
                    <button class="btn btn-sci" data-val="pi" aria-label="pi">π</button>

                    <!-- Memory buttons -->
                    <button class="btn btn-mem" data-val="MC" aria-label="Memory Clear">MC</button>
                    <button class="btn btn-mem" data-val="MR" aria-label="Memory Recall">MR</button>
                    <button class="btn btn-mem" data-val="M+" aria-label="Memory Plus">M+</button>
                    <button class="btn btn-mem" data-val="M-" aria-label="Memory Minus">M-</button>

                    <!-- Basic buttons -->
                    <button class="btn btn-num" data-val="7" aria-label="7">7</button>
                    <button class="btn btn-num" data-val="8" aria-label="8">8</button>
                    <button class="btn btn-num" data-val="9" aria-label="9">9</button>
                    <button class="btn btn-op" data-val="/" aria-label="divide">÷</button>

                    <button class="btn btn-num" data-val="4" aria-label="4">4</button>
                    <button class="btn btn-num" data-val="5" aria-label="5">5</button>
                    <button class="btn btn-num" data-val="6" aria-label="6">6</button>
                    <button class="btn btn-op" data-val="*" aria-label="multiply">×</button>

                    <button class="btn btn-num" data-val="1" aria-label="1">1</button>
                    <button class="btn btn-num" data-val="2" aria-label="2">2</button>
                    <button class="btn btn-num" data-val="3" aria-label="3">3</button>
                    <button class="btn btn-op" data-val="-" aria-label="subtract">−</button>

                    <button class="btn btn-num" data-val="0" aria-label="0">0</button>
                    <button class="btn btn-num" data-val="." aria-label="decimal point">.</button>
                    <button class="btn btn-sci" data-val="e" aria-label="Euler's number e">e</button>
                    <button class="btn btn-op" data-val="+" aria-label="add">+</button>

                    <!-- Parentheses and Equal -->
                    <button class="btn btn-sci" data-val="(" aria-label="left parenthesis">(</button>
                    <button class="btn btn-sci" data-val=")" aria-label="right parenthesis">)</button>
                    <button class="btn btn-sci" data-val="!" aria-label="factorial">!</button>
                    <button class="btn btn-eq" data-val="=" aria-label="equals">=</button>
                </div>
            </main>

            <!-- History Sidebar/Panel -->
            <aside id="history-panel" class="history-panel" aria-label="Calculation History" aria-hidden="true">
                <div class="history-header">
                    <h2>Calculation History</h2>
                    <button id="clear-history" class="control-btn danger-outline-btn" aria-label="Clear calculation history">Clear All</button>
                </div>
                <div id="history-list" class="history-list" aria-live="polite">
                    <div class="no-history">No calculations yet</div>
                </div>
            </aside>
        </div>
    </div>
    
    <script src="calculator.js"></script>
</body>
</html>
